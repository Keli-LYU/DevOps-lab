- name: Configure the EC2 instance to run a sample app
  hosts: ch2_instances
  gather_facts: true
  become: true
  serial: 2
  roles:
    - sample-app

  post_tasks:
    - name: Verify app is running
      uri:
        url: "http://{{ ansible_host }}:8080"
        return_content: yes
        status_code: 200
      register: app_check
      retries: 3
      delay: 5
      delegate_to: localhost
      become: no
      ignore_errors: yes

    - name: Display instance status
      debug:
        msg: "Instance {{ inventory_hostname }} - App status: {{ 'Running' if app_check.status is defined and app_check.status == 200 else 'Failed' }}"